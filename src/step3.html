<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script defer="defer" src="/js/app.js"></script>
    </head>
    <body>
        <div id="jul-constuct">
            <div class="font-roboto text-base font-normal text-black">
                <div class="bg-white pb-1 pt-3 shadow-head">
                    <img src="/assets/logo.png" class="mx-auto" alt />
                </div>
                <div class="flex max-h-[58rem]">
                    <div class="flex w-1/2 flex-col pt-8">
                        <div class="flex-grow overflow-y-auto scrollbar scrollbar-thumb-mscrl scrollbar-thumb-rounded-full scrollbar-w-2">
                            <!--work table-->
                            <div class="relative mx-auto w-fit">
                                <img src="images/chain.png" class="max-h-full" alt="" />
                                <ul class="absolute inset-0 flex flex-col items-center justify-center">
                                    <li class="relative">
                                        <div class="hover:border-lgray !border-lgray relative w-36 min-w-max rounded-lg border-[3px] border-transparent">
                                            <img class="mx-auto" src="images/culon1.png" alt="" />
                                            <button class="absolute right-2 top-2 hidden text-3xl leading-none text-mgray group-hover:block hover:text-mred">&times;</button>
                                            <button class="absolute -bottom-[31.5px] -left-7 hidden pr-4 text-mgray group-hover:block hover:text-mred">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="59" fill="none" viewBox="0 0 15 59">
                                                    <path
                                                        fill="currentColor"
                                                        fill-rule="evenodd"
                                                        d="M14.23 1.259a.5.5 0 0 1 .43.56l-.582 4.462a.5.5 0 1 1-.992-.13l.423-3.234a34.5 34.5 0 0 0 .162 53.3l-.442-3.233a.5.5 0 0 1 .99-.135l.61 4.458a.5.5 0 0 1-.427.563l-4.458.61a.5.5 0 1 1-.136-.99l3.29-.45a35.5 35.5 0 0 1-.167-54.942l-3.293-.43a.5.5 0 0 1 .13-.992l4.462.583Z"
                                                        clip-rule="evenodd" />
                                                </svg>
                                            </button>
                                        </div>
                                    </li>

                                    <li>
                                        <div class="group relative w-36 min-w-max rounded-lg border-2 border-transparent hover:border-mgray">
                                            <img class="mx-auto" src="images/culon2.png" alt="" />
                                            <button class="absolute right-2 top-2 hidden text-3xl leading-none text-mgray group-hover:block hover:text-mred">&times;</button>
                                            <button class="absolute -left-7 -top-[31.5px] hidden pr-4 text-mgray group-hover:block hover:text-mred">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="59" fill="none" viewBox="0 0 15 59">
                                                    <path
                                                        fill="currentColor"
                                                        fill-rule="evenodd"
                                                        d="M14.23 1.259a.5.5 0 0 1 .43.56l-.582 4.462a.5.5 0 1 1-.992-.13l.423-3.234a34.5 34.5 0 0 0 .162 53.3l-.442-3.233a.5.5 0 0 1 .99-.135l.61 4.458a.5.5 0 0 1-.427.563l-4.458.61a.5.5 0 1 1-.136-.99l3.29-.45a35.5 35.5 0 0 1-.167-54.942l-3.293-.43a.5.5 0 0 1 .13-.992l4.462.583Z"
                                                        clip-rule="evenodd" />
                                                </svg>
                                            </button>
                                        </div>
                                    </li>

                                    <li>
                                        <div class="group relative w-36 min-w-max rounded-lg border-2 border-transparent hover:border-mgray">
                                            <img class="mx-auto" src="images/culon3.png" alt="" />
                                            <button class="absolute right-2 top-2 hidden text-3xl leading-none text-mgray group-hover:block hover:text-mred">&times;</button>
                                            <button class="absolute -left-7 -top-[31.5px] hidden pr-4 text-mgray group-hover:block hover:text-mred">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="59" fill="none" viewBox="0 0 15 59">
                                                    <path
                                                        fill="currentColor"
                                                        fill-rule="evenodd"
                                                        d="M14.23 1.259a.5.5 0 0 1 .43.56l-.582 4.462a.5.5 0 1 1-.992-.13l.423-3.234a34.5 34.5 0 0 0 .162 53.3l-.442-3.233a.5.5 0 0 1 .99-.135l.61 4.458a.5.5 0 0 1-.427.563l-4.458.61a.5.5 0 1 1-.136-.99l3.29-.45a35.5 35.5 0 0 1-.167-54.942l-3.293-.43a.5.5 0 0 1 .13-.992l4.462.583Z"
                                                        clip-rule="evenodd" />
                                                </svg>
                                            </button>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                            <!--/work table-->
                        </div>
                        <div class="h-40 pb-48 pt-8 text-center">
                            <button class="h-[3.94rem] w-[22.81rem] rounded-md border border-mgray bg-white text-[1.56rem] text-mgray hover:bg-mgray hover:text-white">Увеличить картинку</button>
                        </div>
                    </div>
                    <div class="w-1/2 bg-no-repeat pb-32 pl-[4.4rem] pt-16" style="background-image: url('/assets/bg.jpg')">
                        <div class="w-[41.8rem]">
                            <h2 class="text-[1.7rem] uppercase">Шаг №5</h2>

                            <p class="mt-8 text-xl font-light">Оформите заказ.</p>
                            <!-- форма-->
                            <div class="my-4 flex flex-col gap-y-3">
                                <div class="flex flex-col gap-y-[0.4rem]">
                                    <label for="" class="font-light text-xl">Ф.И.О</label>
                                    <input type="text" class="h-[3.31rem] flex-grow rounded-xl border border-mgray bg-white indent-6" />
                                </div>
                                <div class="flex gap-3">
                                    <div class="flex flex-col gap-y-[0.4rem] w-56">
                                        <label for="" class="font-light text-xl">Ваш телефон*</label>
                                        <input type="text" class="h-[3.31rem] flex-grow rounded-xl border border-mgray bg-white indent-6" />
                                    </div>
                                    <div class="flex flex-col gap-y-[0.4rem] flex-grow">
                                        <label for="" class="font-light text-xl">Ваш e-mail</label>
                                        <input type="text" class="h-[3.31rem] flex-grow rounded-xl border border-mgray bg-white indent-6" />
                                    </div>
                                </div>
                                <div class="flex flex-col gap-y-[0.4rem]">
                                    <label for="" class="font-light text-xl">Адрес доставки (индекс, город, улица, дом, квартира)</label>
                                    <input type="text" class="h-[3.31rem] flex-grow rounded-xl border border-mgray bg-white indent-6" />
                                </div>
                                <div class="flex flex-col gap-y-[0.4rem]">
                                    <label for="" class="font-light text-xl">Комментарий к заказу</label>
                                    <textarea class="h-28 flex-grow rounded-xl border border-mgray bg-white indent-6"></textarea>
                                </div>
                            </div>
                            <p class="text-xs font-light lg:text-sm">* Обязательно для заполнения</p>
                            <p class="text-xs font-light lg:text-sm">Нажимая “Дальше” вы соглашаетесь с <a href="" class="underline hover:no-underline">политикой обработки персональных данных</a>.</p>                            
                            <!-- /форма-->
                            <div class="mt-16 flex items-center justify-between">
                                <div class="text-xl font-light">
                                    Стоимость изделия от:&nbsp;&nbsp;
                                    <span class="font-normal text-mgray">20 000 ₽</span>
                                </div>
                                <div class="flex gap-4">
                                    <button class="h-[3.44rem] w-[6.56rem] rounded-xl border border-mgray bg-white text-mgray transition-colors hover:bg-mgray hover:text-white">🡨 Назад</button>
                                    <button class="h-[3.44rem] w-[6.56rem] rounded-xl bg-mred font-semibold text-white transition-colors hover:bg-white hover:text-mred">Дальше 🡪</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
